name: Build documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/source/**'
      - 'assets/**'
      - '.github/workflows/doc-build.yaml'

jobs:
   build:
    uses: huggingface/doc-builder/.github/workflows/build_main_documentation.yml@c7489a4b0fa75316588b3913d8580fbba075ccdd  # main
    with:
      commit_sha: ${{ github.sha }}
      package: hf-endpoints-documentation
      package_name: inference-endpoints
      additional_args: --not_python_module
    secrets:
      hf_token: ${{ secrets.HF_DOC_BUILD_PUSH }}

